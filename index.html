<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLATTICE · Harmonic Universe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c14;
            color: #e8ecf5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ----- TOP BAR: minimal title + nav ----- */
        .top-bar {
            padding: 14px 24px;
            background: rgba(10, 12, 20, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #a78bfa, #6d28d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo small {
            font-weight: 400;
            -webkit-text-fill-color: #64748b;
            background: none;
            font-size: 0.75rem;
            margin-left: 6px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
        }
        .nav-links a {
            color: inherit;
            text-decoration: none;
            padding: 4px 8px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .nav-links a:hover {
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.08);
        }

        /* ----- CHAT: fills remaining space ----- */
        .chat-wrapper {
            flex: 1;
            padding: 12px 24px 24px 24px;
            display: flex;
            min-height: 0;
        }

        .chat-card {
            flex: 1;
            background: #141822;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            box-shadow: 0 20px 60px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
        }

        .chat-card iframe {
            flex: 1;
            width: 100%;
            border: none;
            min-height: 400px;
        }

        /* ----- FOOTER / INFO BAR (collapsible / minimal) ----- */
        .info-bar {
            flex-shrink: 0;
            padding: 10px 24px;
            background: rgba(10, 12, 20, 0.85);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 24px;
            font-size: 0.7rem;
            color: #475569;
        }
        .info-bar a {
            color: #6d28d9;
            text-decoration: none;
        }
        .info-bar a:hover {
            color: #a78bfa;
        }
        .info-bar .dot {
            color: #2d3748;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 640px) {
            .top-bar {
                flex-wrap: wrap;
                gap: 8px;
                padding: 10px 16px;
            }
            .nav-links {
                gap: 10px;
                font-size: 0.7rem;
                flex-wrap: wrap;
            }
            .chat-wrapper {
                padding: 8px 12px 12px 12px;
            }
            .chat-card {
                border-radius: 14px;
            }
            .chat-card iframe {
                min-height: 300px;
            }
            .info-bar {
                font-size: 0.6rem;
                padding: 8px 12px;
                gap: 4px 14px;
            }
        }

        @media (max-width: 400px) {
            .logo {
                font-size: 1rem;
            }
            .logo small {
                font-size: 0.6rem;
            }
            .nav-links a {
                padding: 2px 6px;
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR: minimal -->
    <header class="top-bar">
        <div class="logo">
            SOLATTICE
            <small>· harmonic universe</small>
        </div>
        <nav class="nav-links">
			<a href="https://zenodo.org/records/21582012">Solattice Paper</a>
            <a href="https://zenodo.org/records/21544020">28 Beans</a>
            <a href="SOLATTICE@gmail.com">Contact</a>
        </nav>
    </header>

    <!-- CHAT: main content area -->
    <main class="chat-wrapper">
        <div class="chat-card">
            <iframe
                src="https://udify.app/chatbot/QbXtYtxrUoMBclOV"
                title="SOLATTICE AI Agent"                
                loading="lazy"
            ></iframe>
        </div>
    </main>

    <!-- INFO BAR: links + quick ref -->
    <footer class="info-bar">
        <span>✦ <a href="https://zenodo.org/records/21582012">L = L₀ × 666ᵖ × M</a></span>
        <span class="dot">·</span>
        <span>Ocean: <a href="https://zenodo.org/records/21582012">H = 11.23 × (9.81/g)</a></span>
        <span class="dot">·</span>
        <span>Bonds: <a href="https://zenodo.org/records/21582012">C–C = 154 pm</a></span>
        <span class="dot">·</span>
        <span><a href="SOLATTICE@gmail.com">Contact Rikki.D.Scott</a>
        <span class="dot">·</span>
        <span>Hosted: GitHub & <a href="https://udify.app" target="_blank">UDify</a></span>
    </footer>

</body>
</html>
