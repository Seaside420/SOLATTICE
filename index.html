<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLATTICE - Unified Harmonic Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05080c;
    --text: #e8f1f7;
    --accent: #5ee0c0;
    --accent2: #ffd700;
    --accent3: #ff6b6b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Courier New', ui-monospace, monospace;
  }

  canvas {
    position: fixed;
    inset: 0;
    display: block;
    cursor: crosshair;
    background: #05080c;
    z-index: 0;
  }

  .main-container {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    pointer-events: none;
  }

  .title-section {
    pointer-events: auto;
    text-align: center;
  }

  .title-section h1 {
    font-size: clamp(2.2rem, 6vw, 4rem);
    letter-spacing: 0.15em;
    font-weight: 700;
    text-shadow: 0 0 30px rgba(94, 224, 192, 0.5), 0 0 60px rgba(94, 224, 192, 0.3);
    background: linear-gradient(135deg, #ff6b6b 20%, #ffd700 50%, #5ee0c0 80%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    cursor: pointer;
  }

  .title-section p {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.8;
  }

  .iframe-container {
    pointer-events: auto;
    width: 80%;
    max-width: 800px;
    height: 400px;
    background: rgba(5, 8, 12, 0.8);
    border: 1px solid rgba(94, 224, 192, 0.3);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(94, 224, 192, 0.2);
  }

  .iframe-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #05080c;
  }

  .button-panel {
    pointer-events: auto;
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    justify-content: center;
    padding: 1rem;
    background: rgba(5, 8, 12, 0.7);
    border: 1px solid rgba(94, 224, 192, 0.2);
    border-radius: 8px;
    backdrop-filter: blur(10px);
  }

  .btn {
    padding: 0.7rem 1.2rem;
    font-family: 'Courier New', ui-monospace, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text);
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid rgba(255, 107, 107, 0.4);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
  }

  .btn:hover {
    background: rgba(255, 107, 107, 0.25);
    border-color: rgba(255, 107, 107, 0.8);
    box-shadow: 0 0 15px rgba(255, 107, 107, 0.3);
    transform: translateY(-2px);
  }

  .btn:active {
    transform: translateY(0);
    box-shadow: 0 0 8px rgba(255, 107, 107, 0.2);
  }

  .btn:nth-child(2) {
    background: rgba(255, 215, 0, 0.1);
    border-color: rgba(255, 215, 0, 0.4);
  }

  .btn:nth-child(2):hover {
    background: rgba(255, 215, 0, 0.25);
    border-color: rgba(255, 215, 0, 0.8);
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
  }

  .btn:nth-child(3) {
    background: rgba(94, 224, 192, 0.1);
    border-color: rgba(94, 224, 192, 0.4);
  }

  .btn:nth-child(3):hover {
    background: rgba(94, 224, 192, 0.25);
    border-color: rgba(94, 224, 192, 0.8);
    box-shadow: 0 0 15px rgba(94, 224, 192, 0.3);
  }

  .btn:nth-child(4) {
    background: rgba(140, 210, 255, 0.1);
    border-color: rgba(140, 210, 255, 0.4);
  }

  .btn:nth-child(4):hover {
    background: rgba(140, 210, 255, 0.25);
    border-color: rgba(140, 210, 255, 0.8);
    box-shadow: 0 0 15px rgba(140, 210, 255, 0.3);
  }

  .btn:nth-child(5) {
    background: rgba(180, 230, 255, 0.1);
    border-color: rgba(180, 230, 255, 0.4);
  }

  .btn:nth-child(5):hover {
    background: rgba(180, 230, 255, 0.25);
    border-color: rgba(180, 230, 255, 0.8);
    box-shadow: 0 0 15px rgba(180, 230, 255, 0.3);
  }

  .btn:nth-child(6) {
    background: rgba(200, 200, 255, 0.1);
    border-color: rgba(200, 200, 255, 0.4);
  }

  .btn:nth-child(6):hover {
    background: rgba(200, 200, 255, 0.25);
    border-color: rgba(200, 200, 255, 0.8);
    box-shadow: 0 0 15px rgba(200, 200, 255, 0.3);
  }

  @media (max-width: 768px) {
    .iframe-container {
      width: 95%;
      height: 300px;
    }
    
    .button-panel {
      gap: 0.5rem;
      padding: 0.8rem;
    }
    
    .btn {
      padding: 0.5rem 0.8rem;
      font-size: 0.65rem;
    }
  }
</style>
</head>
<body>

<canvas id="mesh"></canvas>

<div class="main-container">
  <div class="title-section">
    <h1>SOLATTICE</h1>
    <p>Unified Harmonic Structure</p>
  </div>

  <div class="iframe-container">
    <iframe src="https://udify.app/chatbot/QbXtYtxrUoMBclOV" title="SOLATTICE AI Agent" loading="lazy"></iframe>
  </div>

  <div class="button-panel">
    <a href="https://zenodo.org/records/21582012" class="btn" onclick="return false;">Solattice: Unified Harmonic Structure</a>
    <a href="https://zenodo.org/records/21544020" class="btn" onclick="return false;">28 Beans: History of the Ounce</a>
    <a href="SOLATTICE@gmail.com" class="btn" onclick="return false;">Contact:</a>
    <!--<a href="#" class="btn" onclick="return false;">Paper 4</a>-->
    <!--<a href="#" class="btn" onclick="return false;">Paper 5</a>-->
    <!--<a href="#" class="btn" onclick="return false;">Paper 6</a>-->
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('mesh');
  const ctx = canvas.getContext('2d');

  let width, height, dpr;
  let cols, rows, spacing;
  let points = [];

  const mouse = { x: -9999, y: -9999, active: false };
  
  const EASE = 0.12;
  
  const harmonicLayers = [
    { innerRadius: 0.750, outerRadius: 1.000, pullFactor: 0.85 },
    { innerRadius: 0.5625, outerRadius: 0.750, pullFactor: 0.70 },
    { innerRadius: 0.4219, outerRadius: 0.5625, pullFactor: 0.55 },
    { innerRadius: 0.3164, outerRadius: 0.4219, pullFactor: 0.40 },
    { innerRadius: 0.2373, outerRadius: 0.3164, pullFactor: 0.25 },
    { innerRadius: 0.0000, outerRadius: 0.2373, pullFactor: 0.10 }
  ];
  
  const RADIUS = 400;

  function buildGrid() {
    spacing = Math.max(45, Math.min(width, height) / 14);
    cols = Math.ceil(width / spacing) + 4;
    rows = Math.ceil(height / spacing) + 4;
    points = [];
    
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const ox = c * spacing - spacing;
        const oy = r * spacing - spacing;
        points.push({ 
          ox: ox, 
          oy: oy, 
          x: ox, 
          y: oy,
          layer: -1
        });
      }
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildGrid();
  }

  function idx(c, r) {
    return r * cols + c;
  }

  function getHarmonicLayer(dist) {
    const normalizedDist = dist / RADIUS;
    
    for (let i = 0; i < harmonicLayers.length; i++) {
      if (normalizedDist >= harmonicLayers[i].innerRadius && 
          normalizedDist < harmonicLayers[i].outerRadius) {
        return i;
      }
    }
    return -1;
  }

  function update() {
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      let targetX = p.ox;
      let targetY = p.oy;
      p.layer = -1;

      if (mouse.active) {
        const dx = p.ox - mouse.x;
        const dy = p.oy - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist < RADIUS) {
          const layer = getHarmonicLayer(dist);
          
          if (layer >= 0) {
            p.layer = layer;
            
            const pullFactor = harmonicLayers[layer].pullFactor;
            const targetDist = dist * pullFactor;
            const angle = Math.atan2(dy, dx);
            
            targetX = mouse.x + Math.cos(angle) * targetDist;
            targetY = mouse.y + Math.sin(angle) * targetDist;
          }
        }
      }

      p.x += (targetX - p.x) * EASE;
      p.y += (targetY - p.y) * EASE;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(140, 210, 255, 0.5)';
    
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const p = points[idx(c, r)];

        if (c < cols - 1) {
          const pn = points[idx(c + 1, r)];
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(pn.x, pn.y);
          ctx.stroke();
        }
        
        if (r < rows - 1) {
          const pn = points[idx(c, r + 1)];
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(pn.x, pn.y);
          ctx.stroke();
        }
      }
    }

    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      
      if (p.layer >= 0) {
        ctx.fillStyle = 'rgba(180, 230, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(180, 230, 255, 0.5)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function setMouse(x, y) {
    mouse.x = x;
    mouse.y = y;
    mouse.active = true;
  }

  window.addEventListener('resize', resize);
  
  window.addEventListener('mousemove', (e) => {
    setMouse(e.clientX, e.clientY);
  });
  
  window.addEventListener('mouseleave', () => {
    mouse.active = false;
  });
  
  window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
      setMouse(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });
  
  window.addEventListener('touchend', () => {
    mouse.active = false;
  });

  resize();
  loop();

})();
</script>

</body>
</html>
